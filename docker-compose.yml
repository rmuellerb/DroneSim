services:
  db:
    image: postgres:18.2
    environment:
      POSTGRES_DB: dronesim
      POSTGRES_USER: dronesim
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dronesim:${DB_PASSWORD}@db:5432/dronesim
    command: gunicorn dronesim.wsgi:application --bind 0.0.0.0:8098
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - static_volume:/app/staticfiles
      - dronesim_logs:/var/log/dronesim
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: celery -A dronesim worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql://dronesim:${DB_PASSWORD}@db:5432/dronesim
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    init: true

volumes:
  pg_data:
  redis_data:
  static_volume:
  dronesim_logs:
